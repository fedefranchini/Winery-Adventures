# pyproject.toml è la fonte unica per metadati, dipendenze e strumenti di
# sviluppo. In questo modo non è necessario mantenere configurazioni duplicate.

[build-system]
# setuptools costruisce e installa il package; wheel permette di produrre un
# artefatto standard quando servirà verificare la distribuzione del progetto.
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "winery-adventures"
version = "0.1.0"
description = "Pipeline for processing and analysing wine fermentation sensor data."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "MarrasFederico" },
    { name = "FedeFranchini" },
]

# Dipendenze runtime richieste dalla consegna. I limiti sulle
# major version evitano aggiornamenti incompatibili, lasciando a pip la scelta
# di patch e minor release compatibili con la versione Python installata.
dependencies = [
    "joblib>=1.3,<2",
    "numba>=0.59,<1",
    "numpy>=1.24,<3",
    "polars>=1.0,<2",
    "tqdm>=4.66,<5",
    "wandb>=0.17,<1",
]

[project.optional-dependencies]
# Installare il gruppo con: python -m pip install -e ".[dev]"
dev = [
    "black>=24,<27",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.5,<1",
]

[tool.setuptools]
# Il benchmark riusa il generatore fornito come modulo Python installabile.
py-modules = ["data_generator"]

[tool.setuptools.packages.find]
# Installa il package applicativo e il runner dei benchmark, escludendo tests,
# data e docs dalla distribuzione.
where = ["."]
include = ["winery_adventures*", "benchmarks*"]

[tool.pytest.ini_options]
# I test originali del docente usano il marker slow nel test di accettazione. La sua
# dichiarazione evita warning e consente di escluderlo con: pytest -m "not slow".
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "slow: test end-to-end o computazionalmente più costoso",
]

[tool.coverage.run]
# La branch coverage rileva rami condizionali non verificati oltre alle righe
# non eseguite. Il report viene applicato solo al codice applicativo.
branch = true
source = ["winery_adventures"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.black]
# 120 caratteri rispettano lo stile già usato nei test e nel generatore forniti.
line-length = 120
target-version = ["py310"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# E/F: errori pycodestyle e Pyflakes; I: import; B: bugbear; UP: sintassi Python
# moderna. La regola sui nomi non è abilitata perché i dati scientifici usano
# legittimamente identificatori come pH già presenti nel materiale fornito.
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# I test originali del professore restano invariati: I001 evita di riscriverne
# soltanto l'ordine degli import; B018 consente espressioni usate come assert.
"tests/**/*.py" = ["B018", "I001"]
