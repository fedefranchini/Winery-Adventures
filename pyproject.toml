# pyproject.toml is the single source for metadata, dependencies, and development
# tools. This avoids the need to maintain duplicate configurations.

[build-system]
# setuptools builds and installs the package; wheel produces a standard
# artifact when the project's distribution needs to be verified.
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "winery-adventures"
version = "0.1.0"
description = "Pipeline for processing and analysing wine fermentation sensor data."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "MarrasFederico" },
    { name = "FedeFranchini" },
]

# Runtime dependencies required by the assignment. Major-version limits
# prevent incompatible upgrades while letting pip choose patch and minor
# releases compatible with the installed Python version.
dependencies = [
    "joblib>=1.3,<2",
    "numba>=0.59,<1",
    "numpy>=1.24,<3",
    # Minimum version verified with the empty_as_null option of explode.
    "polars>=1.44.1,<2",
    "tqdm>=4.66,<5",
    # Supports the explicit reinit="finish_previous" setting.
    "wandb>=0.19.10,<1",
]

[project.optional-dependencies]
# Plotting is optional: pipeline execution and JSON benchmarks do not require it.
plots = ["matplotlib>=3.8,<4"]
# Install this group with: python -m pip install -e ".[dev]"
dev = [
    "black>=24,<27",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.5,<1",
    # Sphinx generates API documentation; MyST integrates Markdown guides.
    "sphinx>=7,<9",
    "myst-parser>=3,<5",
    "matplotlib>=3.8,<4",
]

[tool.setuptools]
# The benchmark reuses the supplied generator as an installable Python module.
py-modules = ["data_generator"]

[tool.setuptools.packages.find]
# Install the application package and benchmark runner, excluding tests,
# data, and docs from the distribution.
where = ["."]
include = ["winery_adventures*", "benchmarks*"]

[tool.pytest.ini_options]
# The professor's original tests use the slow marker for the acceptance test.
# Declaring it avoids warnings and allows excluding it with: pytest -m "not slow".
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "slow: end-to-end or computationally more expensive test",
]

[tool.coverage.run]
# Branch coverage detects untested conditional branches as well as unexecuted
# lines. In addition to the application package, the report covers the dataset
# generator used by examples and benchmarks. Worker-process execution is not
# traced here; sequential generator tests cover the same row-generation logic.
branch = true
source = ["winery_adventures", "data_generator"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.black]
# 120 characters match the style already used in the supplied tests and generator.
line-length = 120
target-version = ["py310"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# E/F: pycodestyle and Pyflakes errors; I: imports; B: bugbear; UP: modern Python
# syntax. Naming rules are not enabled because scientific data legitimately
# uses identifiers such as pH, already present in the supplied material.
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# I001 avoids purely mechanical changes to the import order in tests;
# B018 allows expressions used as assertions in the reference tests.
"tests/**/*.py" = ["B018", "I001"]
